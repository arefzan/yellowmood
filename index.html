<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yellow Mood</title>
<meta name="description" content="Yellow Mood. Ropa con buen mood. Pide por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<style>
/* Plan: papel crema del logo, un solo golpe de amarillo limón (hero y botones),
   titulares Fraunces grandes, catálogo en rejilla editorial 2/3/4 columnas. */
:root{
  color-scheme: light;
  --bg:#F2EEE3; --ink:#33221A; --brand:#7B4B2F; --lemon:#F6CF68; --leaf:#6D8331;
  --card: color-mix(in srgb, var(--bg) 55%, #fff);
  --line: color-mix(in srgb, var(--ink) 14%, transparent);
  --soft: color-mix(in srgb, var(--ink) 62%, var(--bg));
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --body:"Jost", "Avenir Next", "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- tienda ---------- */
.announce{background:var(--brand);color:var(--bg);text-align:center;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.brandmark{display:flex;align-items:center;gap:10px;text-decoration:none}
.brandmark img{height:52px;width:auto;mix-blend-mode:multiply}
.brandmark span{font-family:var(--display);font-size:22px;color:var(--brand);letter-spacing:-.01em}
.top nav{display:flex;align-items:center;gap:6px}
.icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;transition:background .2s}
.icon:hover{background:color-mix(in srgb,var(--lemon) 45%,transparent)}
.icon svg{width:21px;height:21px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--leaf);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}

.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding-top:56px;padding-bottom:56px}
.kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--leaf);font-weight:500;margin:0 0 14px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,8.5vw,96px);line-height:.98;letter-spacing:-.03em;margin:0 0 20px;color:var(--brand);text-wrap:balance}
.hero h1 em{font-style:italic;font-weight:300;background:linear-gradient(transparent 62%,var(--lemon) 62% 92%,transparent 92%)}
.hero p.lead{font-size:18px;font-weight:300;max-width:42ch;margin:0 0 28px;color:var(--soft)}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;font-weight:500;letter-spacing:.03em;text-decoration:none;border:1.5px solid var(--ink);transition:transform .15s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn.fill{background:var(--lemon);border-color:var(--lemon);color:var(--ink)}
.btn.fill:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.wa{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.heroart{position:relative;aspect-ratio:1;max-width:440px;width:100%;justify-self:center}
.heroart .sun{position:absolute;inset:6%;border-radius:50%;background:var(--lemon);opacity:.35}
.heroart svg{position:absolute;inset:0;width:100%;height:100%;animation:float 7s ease-in-out infinite}
.heroart img{position:absolute;inset:4% 12% 0;width:76%;height:96%;object-fit:cover;border-radius:999px 999px 18px 18px;box-shadow:14px 14px 0 var(--lemon)}
@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes rise{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero .kicker,.hero h1,.hero .lead,.hero .cta{animation:rise .7s both}
.hero h1{animation-delay:.08s}.hero .lead{animation-delay:.16s}.hero .cta{animation-delay:.24s}

.catalog{padding:44px 0 72px}
.cathead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.cathead h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);letter-spacing:-.02em;margin:0;color:var(--brand)}
.search{flex:1 1 220px;max-width:320px;height:46px;border:1px solid var(--line);border-radius:999px;background:var(--card);padding:0 18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 18px;border-radius:999px;border:1px solid var(--line);font-size:14px;letter-spacing:.04em;white-space:nowrap;transition:.2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:36px 22px}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--card)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.05)}
.ph .blank{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:64px;color:var(--brand);background:radial-gradient(circle at 70% 25%,color-mix(in srgb,var(--lemon) 70%,transparent),transparent 60%),var(--card)}
.tag{position:absolute;top:10px;left:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;padding:5px 10px;border-radius:999px;background:var(--lemon);color:var(--ink)}
.tag.out{background:var(--ink);color:var(--bg)}
.card h3{font-weight:400;font-size:16px;margin:0;line-height:1.3}
.price{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;color:var(--brand)}
.price s{font-family:var(--body);font-size:14px;color:var(--soft);margin-left:6px}
.sk .ph{background:linear-gradient(100deg,var(--card) 40%,color-mix(in srgb,var(--lemon) 25%,var(--card)) 50%,var(--card) 60%) 0 0/200% 100%;animation:shine 1.3s linear infinite}
.sk i{display:block;height:14px;border-radius:7px;background:var(--card);width:70%}.sk i+i{width:35%}
@keyframes shine{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;padding:48px 0;color:var(--soft)}
.note{background:var(--lemon);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:18px}

footer.foot{border-top:1px solid var(--line);padding:40px 0 110px;text-align:center}
footer.foot img{height:110px;margin:0 auto 10px;mix-blend-mode:multiply}
footer.foot p{margin:6px 0;color:var(--soft)}
.social{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.tiny{font-size:12px;letter-spacing:.06em;color:var(--soft);text-decoration:none}
.fab{position:fixed;right:18px;bottom:18px;z-index:30;width:60px;height:60px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .2s}
.fab:hover{transform:scale(1.08)}
.fab svg{width:30px;height:30px;fill:#fff}

/* hojas / modales */
.veil{position:fixed;inset:0;z-index:40;background:rgba(30,20,14,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:880px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@media(min-width:760px){.veil{align-items:center;padding:24px}.sheet{border-radius:22px}.pd{display:grid;grid-template-columns:1fr 1fr}}
.x{position:sticky;top:10px;float:right;margin:10px 10px -52px 0;z-index:2;width:42px;height:42px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:20px;line-height:1}
.gal{position:relative;background:var(--card)}
.gal .main{aspect-ratio:3/4;width:100%;object-fit:cover}
.gal .blank{aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:110px;color:var(--brand)}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{flex:none;width:56px;height:72px;border-radius:8px;overflow:hidden;border:2px solid transparent}
.thumbs button[aria-current="true"]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:26px 22px 28px;display:flex;flex-direction:column;gap:14px}
.info .cat{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--leaf)}
.info h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:0;color:var(--brand)}
.info .price{font-size:28px}
.info p{margin:0;color:var(--soft);font-weight:300;white-space:pre-line}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.sizes button{min-width:48px;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-weight:500}
.sizes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.bag{padding:24px 20px 28px}
.bag h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 14px;color:var(--brand)}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .mini{width:56px;height:72px;border-radius:8px;object-fit:cover;background:var(--card);display:grid;place-items:center;font-family:var(--display);font-style:italic;color:var(--brand)}
.line small{color:var(--soft);display:block}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0;font-size:18px}
.total b{font-family:var(--display);font-weight:500;font-size:28px;color:var(--brand)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;max-width:90vw;text-align:center;animation:rise .25s}

@media(max-width:760px){
  .hero .wrap{grid-template-columns:1fr;padding-top:34px;padding-bottom:40px}
  .heroart{max-width:230px;order:-1;justify-self:start}
  .brandmark img{height:46px}
}

/* ---------- panel ---------- */
#admin{min-height:100dvh}
.abar{background:var(--ink);color:var(--bg)}
.abar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:58px}
.abar b{font-family:var(--display);font-weight:400;font-size:20px}
.abar a{color:var(--lemon);font-size:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 22px;scrollbar-width:none}
.tabs button{flex:none;padding:16px 16px 13px;border-bottom:3px solid transparent;font-weight:500;color:var(--soft)}
.tabs button[aria-selected="true"]{border-color:var(--lemon);color:var(--ink)}
.panel{padding-bottom:80px}
.panel h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px;color:var(--brand)}
.panel p.help{margin:0 0 18px;color:var(--soft)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f label,.f .lab{font-size:13px;font-weight:500;letter-spacing:.03em}
.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=password],.f input[type=search],.f textarea,.f select{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.f textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;align-items:center;gap:10px;min-height:44px}
.sw input{width:22px;height:22px;accent-color:var(--leaf)}
.row{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row img,.row .mini{width:60px;height:78px;border-radius:8px;object-fit:cover;background:var(--bg);display:grid;place-items:center;font-family:var(--display);font-style:italic;color:var(--brand)}
.row .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.row .meta b{font-weight:500;overflow-wrap:anywhere}
.row .acts{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.pill.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.pill.warn{background:#B3402A;border-color:#B3402A;color:#fff}
.pics{display:flex;flex-wrap:wrap;gap:8px}
.pics div{position:relative;width:74px;height:96px}
.pics img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.pics button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.colors label{display:flex;flex-direction:column;gap:6px;font-size:13px}
.colors input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.tile.hot{background:var(--lemon);border-color:var(--lemon)}
.tile span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
.tile.hot span{color:var(--ink)}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{color:var(--soft)}
.bars{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1px solid var(--line)}
.bars i{flex:1;background:var(--lemon);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars i:last-child{background:var(--leaf)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:6px}
.hbar{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar i{height:10px;border-radius:5px;background:var(--leaf);display:block}
.hbar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 16px}
.monthnav b{font-family:var(--display);font-weight:400;font-size:21px;text-transform:capitalize;text-align:center}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}
.srow small,.row .meta small{color:var(--soft);display:block}
.srow .amt{text-align:right;font-variant-numeric:tabular-nums}
.srow .amt b{font-family:var(--display);font-weight:500;font-size:19px;color:var(--brand)}
.gain{color:var(--leaf);font-weight:500}.loss{color:#B3402A;font-weight:500}
.pill.sell{background:var(--lemon);border-color:var(--lemon);color:var(--ink);font-weight:500}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 16px;font-variant-numeric:tabular-nums}
.login{max-width:380px;margin:60px auto;text-align:center}
.login img{height:150px;margin:0 auto 8px;mix-blend-mode:multiply}
.err{color:#B3402A;font-size:14px;min-height:20px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<div id="store">
  <div class="announce" id="announce"></div>
  <header class="top"><div class="wrap">
    <a class="brandmark" href="#inicio" aria-label="Inicio"><img id="logoTop" alt=""><span id="nameTop" hidden></span></a>
    <nav>
      <a class="icon" id="igTop" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></a>
      <button class="icon" id="bagBtn" aria-label="Mi bolsa"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="badge" id="bagN" hidden>0</span></button>
    </nav>
  </div></header>

  <section class="hero" id="inicio"><div class="wrap">
    <div>
      <p class="kicker" id="heroKicker"></p>
      <h1 id="heroTitle"></h1>
      <p class="lead" id="heroText"></p>
      <div class="cta">
        <a class="btn fill" href="#catalogo" id="heroBtn"></a>
        <a class="btn" id="heroWa" target="_blank" rel="noopener">Escríbenos</a>
      </div>
    </div>
    <div class="heroart" id="heroArt"></div>
  </div></section>

  <main class="catalog" id="catalogo"><div class="wrap">
    <div class="cathead">
      <h2 id="catalogTitle"></h2>
      <input class="search" id="q" type="search" placeholder="Buscar prenda" aria-label="Buscar prenda">
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div></main>

  <footer class="foot"><div class="wrap">
    <img id="logoFoot" alt="">
    <p id="footText"></p>
    <div class="social">
      <a class="btn wa" id="footWa" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn" id="footIg" target="_blank" rel="noopener">Instagram</a>
    </div>
    <p id="footContact"></p>
    <a class="tiny" href="#admin">Administrar tienda</a>
  </div></footer>

  <a class="fab" id="fab" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp"><svg viewBox="0 0 24 24"><path d="M3.6 20.4l1.3-4.1A8.5 8.5 0 1 1 8 19.3z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.1 8.1c.3-.6.7-.6 1-.6l.7 1.6-.6.8c.5 1 1.300 1.800 2.300 2.300l.8-.6 1.600.7c0 .4-.1.8-.6 1.100-2 .9-5.900-2.900-5.200-5.300z" fill="#fff"/></svg></a>
</div>

<div id="admin" hidden></div>
<div id="layer"></div>

<script>

const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const n=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (v==null||v===false) continue;
    if (k==="class") n.className=v; else if (k==="text") n.textContent=v; else if (k==="html") n.innerHTML=v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k, v===true?"":v); }
  for (const c of kids.flat()) if (c!=null&&c!==false) n.append(c); return n; };
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }, set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} } };

let sb=null, live=false, loading=true, failed=false, S=structuredClone(DEFAULTS), products=[], cat="Todo", cart=store.get("ym_cart",[]), isAdmin=false;
try { if (!CFG.url.startsWith("__") && window.supabase) sb = window.supabase.createClient(CFG.url, CFG.key); } catch(e) {}

const money = n => { n=Number(n)||0; return S.currency + (Number.isInteger(n)? n : n.toFixed(2)); };
const waLink = text => "https://wa.me/" + String(S.whatsapp).replace(/\D/g,"") + (text? "?text="+encodeURIComponent(text):"");
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=el("div",{class:"toast",role:"status",text:msg}); document.body.append(t); setTimeout(()=>t.remove(),2800); }
function mergeSettings(d){ S = Object.assign(structuredClone(DEFAULTS), d||{}); S.colors = Object.assign({}, DEFAULTS.colors, (d&&d.colors)||{}); }

/* ---------- visitas ---------- */
function track(kind, productId){
  if (!sb || !live || isAdmin || location.hash==="#admin") return;
  let vid = store.get("ym_vid"); if (!vid) { vid = (crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)); store.set("ym_vid",vid); }
  const r=(document.referrer||"").toLowerCase();
  const source = r.includes("instagram")?"instagram": /whatsapp|wa\.me/.test(r)?"whatsapp": r.includes("facebook")?"facebook": r.includes("google")?"google": r.includes("tiktok")?"tiktok": r&&!r.includes(location.host)?"otro":"directo";
  sb.from("ym_visits").insert({kind, visitor:String(vid).slice(0,40), source, device: innerWidth<760?"teléfono":"computadora", product_id: productId||null}).then(()=>{},()=>{});
}

/* ---------- tienda ---------- */
function applySettings(){
  const r=document.documentElement.style;
  for (const k of Object.keys(DEFAULTS.colors)) r.setProperty("--"+k, S.colors[k]);
  document.title = S.name;
  const logo = S.logo || LOGO;
  $("#logoTop").src=logo; $("#logoFoot").src=logo; $("#logoTop").alt=S.name; $("#logoFoot").alt=S.name;
  $("#announce").textContent=S.announce; $("#announce").hidden=!S.announce;
  $("#heroKicker").textContent=S.heroKicker;
  $("#heroTitle").innerHTML=esc(S.heroTitle).replace(/\*(.+?)\*/g,"<em>$1</em>");
  $("#heroText").textContent=S.heroText; $("#heroBtn").textContent=S.heroBtn;
  $("#catalogTitle").textContent=S.catalogTitle; $("#footText").textContent=S.footer;
  const ig="https://instagram.com/"+encodeURIComponent(String(S.instagram).replace(/^@/,""));
  $("#igTop").href=ig; $("#footIg").href=ig; $("#footIg").textContent="@"+String(S.instagram).replace(/^@/,"");
  const hi=waLink("Hola "+S.name+" 🍋");
  $("#heroWa").href=hi; $("#footWa").href=hi; $("#fab").href=hi;
  $("#footContact").textContent="WhatsApp +"+String(S.whatsapp).replace(/\D/g,"");
  const art=$("#heroArt"); art.innerHTML="";
  if (S.heroImg) art.append(el("img",{src:S.heroImg,alt:""}));
  else art.innerHTML='<div class="sun"></div><svg viewBox="0 0 200 200" aria-hidden="true"><path d="M104 40c36 2 58 34 54 70-4 32-30 56-62 56-9 0-13 8-23 6-8-2-8-10-12-17-14-22-17-44-11-64 8-30 28-52 54-51z" fill="var(--lemon)"/><path d="M106 42c-20-20-52-16-68 6 24 9 48 7 62-4 5-4 12-8 14 6" fill="none" stroke="var(--leaf)" stroke-width="5" stroke-linecap="round"/><path d="M104 42c-20-19-50-15-66 6 24 9 48 7 66-6z" fill="var(--leaf)"/></svg>';
